<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07100e">
  <title>영화관 좌석 위치</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07100e;
      --panel: #0d1916;
      --seat: #40504d;
      --seat-hover: #829892;
      --accent: #1ee4b5;
      --muted: #91a29e;
      --text: #e5efec;
      --line: #1b2b27;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      padding: 34px 16px 48px;
      display: flex;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: 100%; max-width: 750px; }
    header { margin-bottom: 22px; }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 750;
      letter-spacing: -0.045em;
    }
    .description {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .selection-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin: 20px 0 16px;
      padding: 14px 15px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 13px;
    }
    .selection-info { min-width: 0; }
    .selection-label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 11px;
    }
    #selected-list {
      color: var(--accent);
      font-size: 15px;
      font-weight: 750;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    #copy-link {
      flex: 0 0 auto;
      padding: 9px 11px;
      border: 1px solid #2a4941;
      border-radius: 9px;
      background: #14251f;
      color: #cce9e1;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    #copy-link:hover { background: #1b342c; }
    #copy-link:focus-visible, .seat:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .map-shell {
      overflow-x: auto;
      padding: 20px 14px 20px;
      border: 1px solid #172722;
      border-radius: 15px;
      background: #09120f;
      scrollbar-color: #31433d transparent;
    }
    .seat-map { width: 610px; margin: 0 auto; }
    .screen-wrap {
      width: 582px;
      margin: 0 0 27px 28px;
      text-align: center;
    }
    .screen {
      height: 5px;
      border-radius: 50%;
      background: linear-gradient(90deg, transparent, #a4c9bd 12%, #e0f4ec 50%, #a4c9bd 88%, transparent);
      box-shadow: 0 5px 18px rgba(151, 220, 197, .15);
    }
    .screen-label {
      display: block;
      margin-top: 9px;
      color: #72847e;
      font-size: 10px;
      letter-spacing: .22em;
    }
    .seat-row {
      height: 10px;
      display: flex;
      align-items: center;
      margin-bottom: 3px;
    }
    .seat-row:last-child { margin-bottom: 0; }
    .row-label {
      width: 14px;
      flex: 0 0 14px;
      color: #a3b2ae;
      font-size: 11px;
      line-height: 10px;
      font-weight: 700;
      text-align: center;
    }
    .seat-track {
      width: 582px;
      height: 10px;
      flex: 0 0 582px;
      display: grid;
      grid-template-columns: repeat(49, 10px);
      column-gap: 3px;
      margin-left: 14px;
    }
    .seat {
      width: 10px;
      height: 10px;
      min-width: 0;
      padding: 0;
      border: 0;
      border-radius: 3px 3px 4px 4px;
      background: var(--seat);
      cursor: pointer;
      transition: background .12s ease, box-shadow .12s ease, transform .12s ease;
    }
    .seat:hover { background: var(--seat-hover); transform: scale(1.25); }
    .seat.selected {
      background: var(--accent);
      box-shadow: 0 0 9px rgba(30, 228, 181, .58);
    }

    .legend {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 17px;
      color: var(--muted);
      font-size: 11px;
    }
    .legend-item { display: inline-flex; align-items: center; gap: 7px; }
    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 3px;
      background: var(--seat);
    }
    .legend-dot.active {
      background: var(--accent);
      box-shadow: 0 0 7px rgba(30, 228, 181, .45);
    }
    #message {
      min-height: 22px;
      margin: 14px 2px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.65;
      text-align: center;
      overflow-wrap: anywhere;
    }
    #message.error { color: #ffad9b; }

    @media (max-width: 520px) {
      body { padding: 25px 12px 36px; }
      h1 { font-size: 20px; }
      .selection-panel { align-items: flex-start; }
      .map-shell { padding-left: 9px; padding-right: 9px; }
      .seat-map { margin-left: 0; margin-right: 0; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>영화관 좌석 위치</h1>
      <p class="description">선택한 좌석은 민트색으로 강조됩니다. 좌석을 눌러 선택하거나 해제할 수도 있습니다.</p>
    </header>

    <section class="selection-panel" aria-live="polite">
      <div class="selection-info">
        <span class="selection-label">선택한 좌석 · <span id="selected-count">0석</span></span>
        <div id="selected-list">선택된 좌석 없음</div>
      </div>
      <button id="copy-link" type="button">공유 링크 복사</button>
    </section>

    <section class="map-shell" aria-label="영화관 좌석 배치도">
      <div id="seat-map" class="seat-map">
        <div class="screen-wrap" aria-label="스크린 방향">
          <div class="screen"></div>
          <span class="screen-label">SCREEN</span>
        </div>
      </div>
    </section>

    <div class="legend" aria-label="좌석 표시 범례">
      <span class="legend-item"><i class="legend-dot"></i>일반 좌석</span>
      <span class="legend-item"><i class="legend-dot active"></i>선택 좌석</span>
    </div>

    <p id="message">주소 뒤에 <strong>/H12,H13,J12,J3</strong>처럼 좌석 코드를 붙이면 해당 좌석이 표시됩니다.</p>
  </main>

  <script>
    /*
      좌석 배치 설정
      - start: 해당 행에서 가장 먼저 번호를 부여할 좌석 번호
      - seats: 실제 좌석이 있는 가로 위치(0~44)
      - missing: 좌석은 비어 있지만 번호는 건너뛰는 위치. 번호만 1 증가합니다.
      - aisles: 복도 위치. 공간은 비우고 좌석 번호는 증가시키지 않습니다.

      예: seats [0, 1, 3], missing [2]라면 1번, 2번, (빈자리 3번), 4번 좌석이 됩니다.
      예: aisles [4, 5]라면 두 칸 너비의 복도이며 좌석 번호에는 영향을 주지 않습니다.
    */
    const range = (start, end) => Array.from(
      { length: end - start + 1 }, (_, index) => start + index
    );

    // 행별 실제 배치. 가로 위치는 왼쪽부터 0~44입니다.
    // 각 행의 시작 번호, 좌석 누락 위치, 복도 위치를 독립적으로 지정합니다.
    const rowLayout = {
      A: { start: 3, seats: [...range(3, 15), ...range(18, 20), ...range(23, 25), ...range(27, 31), ...range(33, 45)], missing: [17, 21, 22, 26], aisles: [2, 16, 32] },
      B: { start: 3, seats: [...range(3, 15), ...range(17, 31), ...range(33, 45)], missing: [], aisles: [2, 16, 32] },
      C: { start: 3, seats: [...range(3, 15), ...range(17, 31), ...range(33, 45)], missing: [], aisles: [2, 16, 32] },
      D: { start: 3, seats: [...range(3, 15), ...range(17, 31), ...range(33, 45)], missing: [], aisles: [2, 16, 32] },

      E: { start: 3, seats: [...range(3, 15), ...range(17, 30), ...range(33, 45)], missing: [31], aisles: [2, 16, 32] },

      F: { start: 3, seats: [...range(3, 14), ...range(17, 30), ...range(33, 44)], missing: [15, 31], aisles: [2, 16, 32] },
      G: { start: 3, seats: [...range(3, 14), ...range(17, 30), ...range(33, 44)], missing: [15, 31], aisles: [2, 16, 32] },

      H: { start: 3, seats: [...range(3, 14), ...range(17, 30), ...range(33, 44)], missing: [15, 31], aisles: [2, 16, 32] },
      I: { start: 1, seats: [0, 1, ...range(3, 14), ...range(17, 30), ...range(33, 44), ...range(47, 48)], missing: [15, 31, 45], aisles: [2, 16, 32, 46] },

      J: { start: 1, seats: [0, 1, ...range(3, 14), ...range(17, 30), ...range(33, 44), ...range(47, 48)], missing: [15, 31, 45], aisles: [2, 16, 32, 46] },
      K: { start: 1, seats: [0, 1, ...range(3, 14), ...range(17, 30), ...range(33, 44), ...range(47, 48)], missing: [15, 31, 45], aisles: [2, 16, 32, 46] },
      L: { start: 1, seats: [0, 1, ...range(3, 14), ...range(17, 30), ...range(33, 44), ...range(47, 48)], missing: [15, 31, 45], aisles: [2, 16, 32, 46] },

      M: { start: 1, seats: [0, 1, ...range(3, 14), ...range(17, 30), ...range(33, 44), ...range(47, 48)], missing: [15, 31, 45], aisles: [2, 16, 32, 46] },
      N: { start: 1, seats: [0, 1, ...range(3, 14), ...range(17, 30), ...range(33, 44), ...range(47, 48)], missing: [15, 31, 45], aisles: [2, 16, 32, 46] },
      O: { start: 1, seats: [0, 1, ...range(3, 14), ...range(17, 30), ...range(33, 44), ...range(47, 48)], missing: [15, 31, 45], aisles: [2, 16, 32, 46] },

      P: { start: 1, seats: [0, 1, ...range(3, 8), ...range(39, 44), 47, 48], missing: [...range(9, 15),  ...range(17, 31), ...range(33, 38), 45], aisles: [2, 16, 32, 46] }
    };

    // GitHub Pages 사용자 사이트(username.github.io)의 루트에 배포하는 설정입니다.
    // 프로젝트 페이지(username.github.io/repository/)에 배포한다면 '/' 대신 '/repository/'로 바꾸세요.
    
    // URL 형식: 'hash' 또는 'query'
    const URL_MODE = 'hash';

    const selected = new Set();
    const seatButtons = new Map();

    function buildRowSeats(layout) {
      const seatSlots = new Set(layout.seats);
      const missingSlots = new Set(layout.missing);
      const aisleSlots = new Set(layout.aisles);
      const allSlots = [...seatSlots, ...missingSlots, ...aisleSlots];
      if (allSlots.length === 0) return [];

      for (const slot of allSlots) {
        if (!Number.isInteger(slot) || slot < 0 || slot > 48) {
          throw new Error(`좌석 위치는 0~48 범위여야 합니다: ${slot}`);
        }
        if ((seatSlots.has(slot) && missingSlots.has(slot)) ||
            (seatSlots.has(slot) && aisleSlots.has(slot)) ||
            (missingSlots.has(slot) && aisleSlots.has(slot))) {
          throw new Error(`좌석/빈자리/복도 위치가 겹칩니다: ${slot}`);
        }
      }

      const firstSlot = Math.min(...allSlots);
      const lastSlot = Math.max(...allSlots);
      const result = [];
      let seatNumber = layout.start;

      for (let slot = firstSlot; slot <= lastSlot; slot += 1) {
        if (aisleSlots.has(slot)) continue;
        if (seatSlots.has(slot)) {
          result.push({ slot, number: seatNumber });
          seatNumber += 1;
        } else if (missingSlots.has(slot)) {
          seatNumber += 1;
        }
      }
      return result;
    }

    function readInitialCodes() {
      const hashValue = decodeURIComponent(
        location.hash.replace(/^#\/?/, '')
      );

      const params = new URLSearchParams(location.search);

      const queryValue =
        params.get('param') ||
        params.get('seats') ||
        '';

      return hashValue || queryValue;
    }

    function parseCodes(raw) {
      const cleaned = raw.replace(/^seats=/i, '').replace(/^\/+|\/+$/g, '');
      const tokens = cleaned.split(/[,;\s]+/).filter(Boolean);
      const valid = [];
      const invalid = [];

      for (const token of tokens) {
        const match = token.match(/^([A-P])\s*0*(\d+)$/i);
        if (!match) {
          invalid.push(token);
          continue;
        }
        const code = `${match[1].toUpperCase()}${Number(match[2])}`;
        if (seatButtons.has(code)) valid.push(code);
        else invalid.push(code);
      }
      return { valid: [...new Set(valid)], invalid };
    }

    function makeMap() {
      const map = document.getElementById('seat-map');

      for (const [row, layout] of Object.entries(rowLayout)) {
        const rowElement = document.createElement('div');
        rowElement.className = 'seat-row';

        const label = document.createElement('span');
        label.className = 'row-label';
        label.textContent = row;
        rowElement.appendChild(label);

        const track = document.createElement('div');
        track.className = 'seat-track';

        for (const { slot, number } of buildRowSeats(layout)) {
          const code = `${row}${number}`;
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'seat';
          button.style.gridColumn = String(slot + 1);
          button.dataset.seat = code;
          button.title = code;
          button.setAttribute('aria-label', `${code} 좌석 선택`);
          button.addEventListener('click', () => toggleSeat(code));
          track.appendChild(button);
          seatButtons.set(code, button);
        }

        rowElement.appendChild(track);
        map.appendChild(rowElement);
      }
    }

    function sortCodes(codes) {
      return [...codes].sort((a, b) => {
        const rowCompare = a[0].localeCompare(b[0]);
        return rowCompare || Number(a.slice(1)) - Number(b.slice(1));
      });
    }

    function render() {
      for (const [code, button] of seatButtons) {
        const isSelected = selected.has(code);
        button.classList.toggle('selected', isSelected);
        button.setAttribute('aria-pressed', String(isSelected));
      }

      const codes = sortCodes(selected);
      document.getElementById('selected-count').textContent = `${codes.length}석`;
      document.getElementById('selected-list').textContent = codes.length
        ? codes.join(', ')
        : '선택된 좌석 없음';
    }

    function syncUrl() {
      const url = new URL(location.href);
      const codes = sortCodes(selected);

      if (URL_MODE === 'hash') {
        url.searchParams.delete('param');
        url.searchParams.delete('seats');
        url.hash = codes.length ? codes.join(',') : '';
      } else {
        url.hash = '';
        url.searchParams.delete('seats');
        url.searchParams.delete('param');

        if (codes.length) {
          url.searchParams.set('param', codes.join(','));
        }
      }

      history.replaceState(null, '', url);
    }

    function toggleSeat(code) {
      if (selected.has(code)) selected.delete(code);
      else selected.add(code);
      render();
      syncUrl();

      const message = document.getElementById('message');
      message.classList.remove('error');
      message.textContent = '좌석을 눌러 선택하거나 해제할 수 있습니다. 공유 링크를 복사해 전달하세요.';
    }

    document.getElementById('copy-link').addEventListener('click', async () => {
      const button = document.getElementById('copy-link');
      const message = document.getElementById('message');
      try {
        await navigator.clipboard.writeText(location.href);
        button.textContent = '복사 완료!';
        message.textContent = '선택 좌석이 포함된 링크를 복사했습니다.';
      } catch {
        message.textContent = `주소창의 링크를 복사해 공유하세요: ${location.href}`;
      }
      setTimeout(() => { button.textContent = '공유 링크 복사'; }, 1600);
    });

    makeMap();
    const initial = parseCodes(readInitialCodes());
    initial.valid.forEach(code => selected.add(code));
    render();

    if (initial.invalid.length) {
      const message = document.getElementById('message');
      message.classList.add('error');
      message.textContent = `존재하지 않는 좌석 코드: ${initial.invalid.join(', ')}`;
    } else if (initial.valid.length) {
      document.getElementById('message').textContent = '선택 좌석이 민트색으로 표시됩니다. 좌석을 눌러 변경할 수 있습니다.';
    }
  </script>
</body>
</html>
