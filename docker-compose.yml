version: "3.9"

services:
  app:
    image: ghcr.io/sisu-01/cgv-watch:latest
    restart: unless-stopped

    environment:
      TZ: Asia/Seoul
      SCREEN_YMD: ${SCREEN_YMD}
      IS_DEV: ${IS_DEV:-false}   # 기본값 false

    env_file:
      - .env

    volumes:
      - ./logs/${SCREEN_YMD}:/app/logs
      - ./debug/${SCREEN_YMD}:/app/debug