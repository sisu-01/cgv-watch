services:
  cgv-watch:
    image: ghcr.io/sisu-01/cgv-watch:latest
    restart: unless-stopped
    command: ["./start.sh"]

    environment:
      SCREEN_YMD: ${SCREEN_YMD}
      IS_DEV: ${IS_DEV:-false}

    env_file:
      - .env

    volumes:
      - ./logs/${SCREEN_YMD}:/app/logs
      - ./debug/${SCREEN_YMD}:/app/debug
  server:
    image: ghcr.io/sisu-01/cgv-watch:latest
    restart: unless-stopped
    command: ["npm", "run", "ws:server"]

  publisher:
    image: ghcr.io/sisu-01/cgv-watch:latest
    restart: unless-stopped
    command: ["npm", "run", "ws:publisher"]

    environment:
      SCREEN_YMD: ${SCREEN_YMD}
      IS_DEV: ${IS_DEV:-false}

    env_file:
      - .env

    volumes:
      - ./logs/${SCREEN_YMD}:/app/logs
      - ./debug/${SCREEN_YMD}:/app/debug

  subscriber:
    image: ghcr.io/sisu-01/cgv-watch:latest
    restart: unless-stopped
    command: ["npm", "run", "ws:subscriber"]

    environment:
      IS_DEV: ${IS_DEV:-false}
      CLIENT_NUMBER: ${CLIENT_NUMBER}

    env_file:
      - .env

    volumes:
      - ./logs/${SCREEN_YMD}:/app/logs
      - ./debug/${SCREEN_YMD}:/app/debug
  